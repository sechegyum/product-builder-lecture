  <text x="540" y="880" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#8B5BD6">이커머스</text>
  <rect x="704" y="846" width="296" height="54" rx="27" fill="#FFFFFF"/>
  <text x="852" y="880" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#8B5BD6">비트코인 채굴</text>

