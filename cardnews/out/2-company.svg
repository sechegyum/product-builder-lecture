  <text x="233" y="962" text-anchor="middle" font-size="21" font-weight="600" fill="#9691B8">시가총액</text>
  <text x="233" y="1012" text-anchor="middle" font-size="32" font-weight="700" letter-spacing="-0.8" fill="#2B2B3A">약 627만 달러</text>
