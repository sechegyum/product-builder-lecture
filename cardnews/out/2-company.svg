<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img">
<title>우리기술투자 · 어떤 회사일까</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#FBF9FF"/><stop offset="1" stop-color="#EFEAFC"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4A6CF7"/><stop offset="0.5" stop-color="#B455C4"/><stop offset="1" stop-color="#E0568A"/>
  </linearGradient>
  <linearGradient id="dom" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4A6CF7"/><stop offset="0.55" stop-color="#B455C4"/><stop offset="1" stop-color="#E0568A"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<circle cx="920" cy="180" r="200" fill="#B455C4" opacity="0.06"/>
<defs><clipPath id="pc"><rect x="40" y="280" width="1000" height="340" rx="52"/></clipPath></defs>
<g clip-path="url(#pc)"><image x="40" y="280" width="1000" height="340" preserveAspectRatio="xMidYMid slice" href="data:image/png;base64,"/></g>
<g font-family="Pretendard, Poppins, Arial, sans-serif">
  <text x="80" y="118" font-size="30" fill="#B455C4">✦</text>
  <text x="126" y="118" font-size="25" font-weight="700" letter-spacing="2.5" fill="#8B5BD6">SNAPVEST AI SIGNAL</text>
  <text x="1000" y="118" text-anchor="end" font-size="25" font-weight="600" fill="#B9B3D6">08.22</text>
  <text x="80" y="222" font-size="60" font-weight="700" letter-spacing="-2.5" fill="#2B2B3A">우리기술투자는 <tspan fill="#B455C4">어떤 회사</tspan>일까?</text>
  <rect x="80" y="248" width="220" height="12" rx="6" fill="url(#line)"/>

  <text x="80" y="700" font-size="38" font-weight="700" letter-spacing="-1.5" fill="#2B2B3A">스타트업에 돈을 넣는</text>
  <text x="80" y="750" font-size="38" font-weight="700" letter-spacing="-1.5" fill="#2B2B3A">코스닥 상장 창업투자회사예요</text>
  <text x="80" y="804" font-size="27" font-weight="500" letter-spacing="-0.5" fill="#8B85A8">2015년 두나무에 56억원을 넣은 게 지금의 이름값이에요</text>

  <rect x="80" y="852" width="920" height="176" rx="52" fill="#FFFFFF"/>
  <text x="233" y="916" text-anchor="middle" font-size="24" font-weight="600" fill="#9691B8">시가총액</text>
  <text x="233" y="974" text-anchor="middle" font-size="42" font-weight="700" letter-spacing="-1" fill="#2B2B3A">4,973억원</text>
  <line x1="387" y1="896" x2="387" y2="984" stroke="#F1EDFA" stroke-width="3"/>
  <text x="540" y="916" text-anchor="middle" font-size="24" font-weight="600" fill="#9691B8">거래량</text>
  <text x="540" y="974" text-anchor="middle" font-size="42" font-weight="700" letter-spacing="-1" fill="#2B2B3A">평균 41배</text>
  <line x1="693" y1="896" x2="693" y2="984" stroke="#F1EDFA" stroke-width="3"/>
  <text x="847" y="916" text-anchor="middle" font-size="24" font-weight="600" fill="#9691B8">52주 위치</text>
  <text x="847" y="974" text-anchor="middle" font-size="42" font-weight="700" letter-spacing="-1" fill="#2B2B3A">하위 23%</text>
