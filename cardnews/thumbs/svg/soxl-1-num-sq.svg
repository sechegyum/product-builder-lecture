<rect width="1080" height="1080" fill="url(#bg)"/>
<rect x="-205" y="-162" width="907" height="907" fill="url(#m1)"/>
<rect x="443" y="497" width="940" height="940" fill="url(#m2)"/>
<g font-family="Pretendard, Poppins, Arial, sans-serif">
  <text x="80" y="170" font-size="28" font-weight="700" letter-spacing="2.5" fill="#8B5BD6">3배 ETF</text>
